<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1410" />
  <link rel="manifest" href="manifest.json" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <title>Конный клуб — CRM</title>
  <style>
    :root {
      --bg: #1a1410;
      --panel: #2a2018;
      --panel-2: #3a2c20;
      --border: #4a3826;
      --text: #f5ecd9;
      --muted: #b8a68a;
      --accent: #b45309;
      --accent-2: #d97706;
      --success: #4d7c0f;
      --danger: #991b1b;
      --input-bg: #1f170f;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
      --nav-h: 64px;
    }
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; margin: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      overscroll-behavior: none;
    }
    button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
    input, select { font: inherit; }

    .app {
      max-width: 480px;
      margin: 0 auto;
      height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: calc(var(--nav-h) + var(--safe-bottom) + 8px);
      box-sizing: border-box;
    }
    .topbar {
      flex-shrink: 0;
      padding: 12px 16px 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .topbar h1 { font-size: 1.05rem; margin: 0; flex: 1; }
    .topbar .role-badge {
      font-size: 11px; padding: 4px 8px; border-radius: 999px;
      background: var(--panel-2); color: var(--muted); white-space: nowrap;
    }
    .topbar .logout { font-size: 18px; padding: 6px; }

    .content {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 12px;
      -webkit-overflow-scrolling: touch;
    }
    .view { display: none; }
    .view.active { display: block; }

    .bottom-nav {
      position: fixed;
      left: 0; right: 0; bottom: 0;
      height: calc(var(--nav-h) + var(--safe-bottom));
      padding-bottom: var(--safe-bottom);
      background: var(--panel);
      border-top: 1px solid var(--border);
      display: flex;
      z-index: 100;
      max-width: 480px;
      margin: 0 auto;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-size: 11px;
      color: var(--muted);
      padding: 6px 0;
    }
    .nav-btn .ico { font-size: 20px; line-height: 1; }
    .nav-btn.active { color: var(--accent-2); }
    .nav-btn.active .ico { transform: scale(1.1); }

    .card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 12px;
    }
    .card h2 {
      font-size: 0.95rem; margin: 0 0 10px;
      display: flex; align-items: center; justify-content: space-between; gap: 8px;
    }
    .card h2 .sub { font-size: 11px; color: var(--muted); font-weight: 400; }

    .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
    .row input, .row select,
    .field input, .field select,
    .manip select, .manip input[type="time"],
    .role-option {
      background: var(--input-bg);
    }
    .row input, .row select {
      flex: 1; min-width: 120px;
      padding: 10px 12px;
      border-radius: 12px;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 16px;
    }
    .row input::placeholder { color: #7a6852; }

    .btn {
      padding: 10px 16px; border-radius: 12px;
      background: var(--accent); color: #fff; font-weight: 600; font-size: 14px;
    }
    .btn.small { padding: 7px 12px; font-size: 13px; }
    .btn.ghost { background: var(--panel-2); color: var(--text); }
    .btn.danger { background: var(--danger); }
    .btn.block { width: 100%; }

    .list-item {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 0; border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .list-item:last-child { border-bottom: none; }
    .list-item .name { flex: 1; }
    .list-item .meta { font-size: 12px; color: var(--muted); }

    .cal-head { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; }
    .cal-head .title { flex: 1; font-weight: 700; font-size: 15px; text-align: center; color: #fbead0; }
    .cal-head button {
      width: 36px; height: 36px; border-radius: 10px;
      background: #3a2c20; font-size: 18px; color: #f5ecd9;
      display: flex; align-items: center; justify-content: center;
      border: 1px solid var(--border);
    }
    .cal-modes { display: flex; gap: 6px; margin-bottom: 10px; }
    .cal-modes button {
      flex: 1; padding: 8px; border-radius: 10px;
      background: #3a2c20; color: #d9c6a6;
      font-size: 13px; font-weight: 600;
      border: 1px solid var(--border);
    }
    .cal-modes button.active {
      background: linear-gradient(180deg, #d97706, #b45309);
      color: #fff8ec; border-color: #d97706;
    }

        .month-grid {
      display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px;
      background: #120d09;                 /* подложка под сеткой — тёмная «земля» */
      padding: 6px; border-radius: 12px;
    }
    .month-grid .dow {
      font-size: 10px; color: #e7d7ba; text-align: center; padding: 4px 0;
      text-transform: uppercase; letter-spacing: .04em;
    }
    .month-cell {
      min-height: 56px;
      background: #2f2419;                 /* светлее panel — ячейка отделяется от подложки */
      border: 1px solid #5a4229;
      border-radius: 8px;
      padding: 4px;
      font-size: 11px;
      position: relative;
      overflow: hidden;
      color: #f5ecd9;
    }
    .month-cell.today {
      border-color: #f59e0b;
      background: #4a3418;
      box-shadow: 0 0 0 1px #f59e0b inset;
    }
    .month-cell.other { opacity: .35; }
    .month-cell .num { font-weight: 700; font-size: 11px; color: #fbead0; }
    .month-cell .ev {
      margin-top: 2px; font-size: 9px; line-height: 1.15;
      background: #b45309; color: #fff8ec;
      border-radius: 3px; padding: 1px 3px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      cursor: pointer;
      font-weight: 600;
    }

    .week-grid, .day-grid { display: flex; flex-direction: column; gap: 8px; }
    .day-block {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      cursor: pointer;
    }
    .day-block.today-block { border-color: var(--accent-2); box-shadow: 0 0 0 1px var(--accent-2) inset; }
    .day-block .day-title {
      font-size: 12px; color: var(--muted); margin-bottom: 6px; font-weight: 600;
      display: flex; align-items: center; gap: 6px;
    }
    .lesson {
      display: flex; gap: 8px; align-items: flex-start;
      padding: 8px 0; border-bottom: 1px dashed var(--border);
      cursor: pointer;
    }
    .lesson:last-child { border-bottom: none; }
    .lesson .time {
      font-size: 12px; font-weight: 700; color: var(--accent-2);
      min-width: 44px;
    }
    .lesson .info { flex: 1; font-size: 13px; }
    .lesson .info .horse { color: var(--muted); font-size: 12px; }
    .lesson .readiness { width: 60px; flex-shrink: 0; text-align: center; }
    .readiness-pct { font-size: 12px; font-weight: 700; color: var(--accent-2); }
    .readiness-bar {
      height: 6px; border-radius: 3px; background: var(--input-bg); margin-top: 4px; overflow: hidden;
    }
    .readiness-bar span { display: block; height: 100%; background: linear-gradient(90deg, #b45309, #d97706); transition: width .3s; }

    .manip {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0; border-bottom: 1px dashed var(--border);
      flex-wrap: wrap;
    }
    .manip:last-child { border-bottom: none; }
    .manip .label { flex: 1.4; font-size: 13px; min-width: 120px; }
    .manip select, .manip input[type="time"] {
      padding: 6px 8px; border-radius: 8px;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 12px; min-width: 0;
    }
    .manip input[type="checkbox"] {
      width: 20px; height: 20px; accent-color: var(--accent); flex-shrink: 0;
    }
    .manip.done .label { text-decoration: line-through; opacity: .55; }
    .manip .who { font-size: 11px; color: var(--muted); }

    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.65);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 1000;
    }
    .overlay.show { display: flex; }
    .sheet {
      width: 100%; max-width: 480px;
      background: var(--panel);
      border-radius: 20px 20px 0 0;
      padding: 18px 16px calc(16px + var(--safe-bottom));
      max-height: 88vh; overflow-y: auto;
      border: 1px solid var(--border); border-bottom: none;
    }
    .sheet h3 { margin: 0 0 12px; font-size: 16px; }
    .field { margin-bottom: 10px; }
    .field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .field input, .field select {
      width: 100%; padding: 11px 12px; border-radius: 12px;
      border: 1px solid var(--border);
      color: var(--text);
      font-size: 16px;
    }
    .sheet-actions { display: flex; gap: 8px; margin-top: 8px; }
    .sheet-actions .btn { flex: 1; }

    .role-option {
      display: flex; align-items: center; gap: 10px;
      padding: 14px; border-radius: 12px;
      border: 1px solid var(--border); margin-bottom: 8px;
    }
    .role-option input { width: 20px; height: 20px; accent-color: var(--accent); }
    .role-option .role-info { flex: 1; }
    .role-option .role-info strong { display: block; font-size: 14px; }
    .role-option .role-info small { color: var(--muted); font-size: 11px; }

    .empty { text-align: center; color: var(--muted); padding: 24px 0; font-size: 13px; }
    .toast {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      background: var(--danger); color: #fff;
      padding: 10px 16px; border-radius: 10px;
      font-size: 13px; z-index: 2000; display: none;
      max-width: calc(100% - 32px);
      box-shadow: 0 6px 20px rgba(0,0,0,.35);
    }
    .toast.show { display: block; }
    .toast.success { background: var(--success); }

    .tabs-inline { display: flex; gap: 6px; margin-bottom: 10px; }
    .tabs-inline button {
      flex: 1; padding: 8px; border-radius: 10px;
      background: var(--panel-2); color: var(--muted);
      font-size: 12px; font-weight: 600;
    }
    .tabs-inline button.active { background: var(--accent); color: #fff; }

    .badge {
      display: inline-block; padding: 2px 8px; border-radius: 999px;
      font-size: 10px; font-weight: 700; background: var(--panel-2); color: var(--muted);
    }
    .badge.done { background: rgba(77,124,15,.25); color: #a3e635; }
    .badge.mine { background: rgba(180,83,9,.3); color: #fbbf24; }
    button.badge { border: none; cursor: pointer; }
  </style>
</head>
<body>
  <div id="toast" class="toast"></div>

    <div id="loginScreen" style="max-width:480px;margin:0 auto;padding:24px 16px;min-height:100vh;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center;">
    <div style="text-align:center;margin-bottom:24px;">
      <div style="font-size:48px;line-height:1;margin-bottom:8px;">🐎</div>
      <h1 style="font-size:1.3rem;margin:0 0 4px;">Конный клуб — CRM</h1>
      <div style="font-size:12px;color:var(--muted);">Прототип · данные на устройстве</div>
    </div>
    <div class="card">
      <h2>Вход</h2>
      <div class="field">
        <label>Имя сотрудника</label>
        <select id="loginName"></select>
      </div>
      <button class="btn block" id="loginBtn" style="margin-top:8px;">Войти</button>
      <div class="empty" id="loginHint">Сначала добавьте сотрудников в админ-режиме.</div>
    </div>
  </div>

  <div class="app" id="appScreen" style="display:none;">
    <div class="topbar">
      <h1 id="topTitle">Конный клуб</h1>
      <span class="role-badge" id="topRole">—</span>
      <button class="logout" id="logoutBtn" title="Выйти">⎋</button>
    </div>

    <div class="content">
      <div class="view" id="viewSchedule">
        <div class="card">
          <div class="cal-head">
            <button id="calPrev">←</button>
            <div class="title" id="calTitle">—</div>
            <button id="calNext">→</button>
          </div>
          <div class="cal-modes">
            <button data-mode="month" class="active">Месяц</button>
            <button data-mode="week">Неделя</button>
            <button data-mode="day">День</button>
          </div>
          <div id="calendarArea"></div>
        </div>
        <button class="btn block" id="addLessonBtn">+ Добавить тренировку</button>
      </div>

      <div class="view" id="viewTasks">
        <div class="card">
          <h2>Мои задачи <span class="sub" id="tasksDateLabel">—</span></h2>
          <div class="tabs-inline" id="tasksPhaseTabs">
            <button data-phase="pre" class="active">До тренировки</button>
            <button data-phase="post">После тренировки</button>
          </div>
          <div id="tasksList"></div>
        </div>
      </div>

      <div class="view" id="viewHorses">
        <div class="card">
          <h2>Лошади <span class="sub">манипуляции на сегодня</span></h2>
          <div id="horsesList"></div>
        </div>
      </div>

      <div class="view" id="viewAdmin">
        <div class="card">
          <h2>Сотрудники</h2>
          <div class="row">
            <input id="newStaff" placeholder="Имя сотрудника" />
            <select id="newStaffRole">
              <option value="staff">Сотрудник</option>
              <option value="trainer">Тренер</option>
              <option value="owner">Владелец</option>
            </select>
            <button class="btn small" id="addStaffBtn">Добавить</button>
          </div>
          <div id="staffAdminList"></div>
        </div>

        <div class="card">
          <h2>Лошади</h2>
          <div class="row">
            <input id="newHorse" placeholder="Кличка" />
            <button class="btn small" id="addHorseBtn">Добавить</button>
          </div>
          <div id="horseAdminList"></div>
        </div>

        <div class="card">
          <h2>Манипуляции <span class="sub">чек-лист до/после</span></h2>
          <div class="tabs-inline" id="manipPhaseTabs">
            <button data-phase="pre" class="active">До</button>
            <button data-phase="post">После</button>
          </div>
          <div class="row">
            <input id="newManip" placeholder="Название манипуляции" />
            <button class="btn small" id="addManipBtn">Добавить</button>
          </div>
          <div id="manipAdminList"></div>
        </div>
      </div>
    </div>

    <nav class="bottom-nav" id="bottomNav">
      <button class="nav-btn" data-view="schedule"><span class="ico">📅</span>Расписание</button>
      <button class="nav-btn" data-view="tasks"><span class="ico">✅</span>Задачи</button>
      <button class="nav-btn" data-view="horses"><span class="ico">🐎</span>Лошади</button>
      <button class="nav-btn" data-view="admin"><span class="ico">⚙️</span>Админ</button>
    </nav>
  </div>

  <div class="overlay" id="lessonModal">
    <div class="sheet">
      <h3 id="lessonModalTitle">Новая тренировка</h3>
      <div class="field">
        <label>Дата</label>
        <input type="date" id="lessonDate" />
      </div>
      <div class="field">
        <label>Время</label>
        <input type="time" id="lessonTime" />
      </div>
      <div class="field">
        <label>Лошадь</label>
        <select id="lessonHorse"></select>
      </div>
      <div class="field">
        <label>Тренер</label>
        <select id="lessonTrainer"></select>
      </div>
      <div class="field">
        <label>Ученик</label>
        <input type="text" id="lessonStudent" placeholder="Имя ученика" />
      </div>
      <div class="field">
        <label>Длительность, мин</label>
        <input type="number" id="lessonDuration" value="60" min="30" step="15" />
      </div>
      <div class="sheet-actions">
        <button class="btn ghost" id="lessonCancel">Отмена</button>
        <button class="btn" id="lessonSave">Сохранить</button>
      </div>
      <button class="btn danger block" id="lessonDelete" style="display:none;margin-top:8px;">Удалить тренировку</button>
    </div>
  </div>

<script>
const KEY = 'horse_crm_v1';
const DEFAULT_HORSES = ['Атос', 'Портос', 'Арамис', 'Артик', 'Империя'];

const DEFAULT_STATE = {
  staff: [
    { id: 's1', name: 'Анна', role: 'trainer' },
    { id: 's2', name: 'Пётр', role: 'staff' },
    { id: 's3', name: 'Мария', role: 'staff' }
  ],
  horses: DEFAULT_HORSES.map((n, i) => ({ id: 'h' + (i + 1), name: n })),
  manipulations: {
    pre: [
      { id: 'p1', name: 'Почистить' },
      { id: 'p2', name: 'Расчесать гриву/хвост' },
      { id: 'p3', name: 'Проверить копыта' },
      { id: 'p4', name: 'Седлать' },
      { id: 'p5', name: 'Надеть уздечку' }
    ],
    post: [
      { id: 'p6', name: 'Расседлать' },
      { id: 'p7', name: 'Снять уздечку' },
      { id: 'p8', name: 'Помыть стремена' },
      { id: 'p9', name: 'Протереть седло' },
      { id: 'p10', name: 'Дать воду' },
      { id: 'p11', name: 'Осмотреть ноги' }
    ]
  },
  lessons: [],
  tasks: []
};

let state = loadState();
let currentUser = null;
let calMode = 'month';
let calCursor = new Date();
let openWeekDay = null;
let editingLessonId = null;

function loadState() {
  try {
    const raw = localStorage.getItem(KEY);
    if (raw) {
      const s = JSON.parse(raw);
      s.manipulations = s.manipulations || { pre: [], post: [] };
      s.lessons = s.lessons || [];
      s.tasks = s.tasks || [];
      s.staff = s.staff || [];
      s.horses = s.horses || [];
      return s;
    }
  } catch (e) {}
  return JSON.parse(JSON.stringify(DEFAULT_STATE));
}
function saveState() { localStorage.setItem(KEY, JSON.stringify(state)); }

const $ = (sel) => document.querySelector(sel);
const $$ = (sel) => Array.from(document.querySelectorAll(sel));
const uid = (p) => p + '_' + Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const pad = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
const sameDay = (a, b) => a.getFullYear() === b.getFullYear() && a.getMonth() === b.getMonth() && a.getDate() === b.getDate();
const todayStr = () => ymd(new Date());

function toast(msg, ok = false) {
  const t = $('#toast');
  t.textContent = msg;
  t.className = 'toast show' + (ok ? ' success' : '');
  clearTimeout(t._t);
  t._t = setTimeout(() => t.classList.remove('show'), 2600);
}
function horseName(id) { return (state.horses.find(h => h.id === id) || {}).name || '—'; }
function staffName(id) { return (state.staff.find(s => s.id === id) || {}).name || '—'; }
function lockScroll()   { document.body.style.overflow = 'hidden'; }
function unlockScroll() { document.body.style.overflow = ''; }

const ROLES = {
  owner:   { title: 'Владелец',  desc: 'Расписание, лошади, сотрудники, манипуляции' },
  trainer: { title: 'Тренер',    desc: 'Свои тренировки и назначенные задачи' },
  staff:   { title: 'Сотрудник', desc: 'Только назначенные манипуляции' }
};

function renderLogin() {
  const nameSel = $('#loginName');
  nameSel.innerHTML = state.staff.map(s =>
    `<option value="${s.id}">${s.name} — ${ROLES[s.role] ? ROLES[s.role].title : s.role}</option>`
  ).join('');
  $('#loginHint').style.display = state.staff.length ? 'none' : 'block';
  $('#loginBtn').disabled = !state.staff.length;
}

$('#loginBtn').addEventListener('click', () => {
  const staffId = $('#loginName').value;
  if (!staffId) return toast('Выберите сотрудника');
  const person = state.staff.find(s => s.id === staffId);
  if (!person) return toast('Сотрудник не найден');
  const role = person.role;               // роль берём из данных, а не из выбора
  currentUser = { staffId, role, name: person.name };
  $('#loginScreen').style.display = 'none';
  $('#appScreen').style.display = 'flex';
  $('#topRole').textContent = ROLES[role].title + ' · ' + currentUser.name;
  startApp();
});

$('#logoutBtn').addEventListener('click', () => {
  currentUser = null;
  $('#appScreen').style.display = 'none';
  $('#loginScreen').style.display = 'flex';
  renderLogin();
});

function allowedViews(role) {
  if (role === 'owner') return ['schedule', 'tasks', 'horses', 'admin'];
  if (role === 'trainer') return ['schedule', 'tasks', 'horses'];
  return ['tasks', 'horses'];
}

function startApp() {
  const views = allowedViews(currentUser.role);
  $$('#bottomNav .nav-btn').forEach(b => {
    b.style.display = views.includes(b.dataset.view) ? '' : 'none';
  });
  switchView(views[0]);
}

function switchView(view) {
  const views = allowedViews(currentUser.role);
  if (!views.includes(view)) view = views[0];
  $$('#bottomNav .nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === view));
  $$('.view').forEach(v => v.classList.remove('active'));
  const el = $('#view' + view.charAt(0).toUpperCase() + view.slice(1));
  if (el) el.classList.add('active');
  if (view === 'schedule') { openWeekDay = null; renderCalendar(); }
  if (view === 'tasks') renderTasks();
  if (view === 'horses') renderHorsesView();
  if (view === 'admin') renderAdmin();
}

$$('#bottomNav .nav-btn').forEach(b => b.addEventListener('click', () => switchView(b.dataset.view)));

/* ===== РАСПИСАНИЕ ===== */
$$('.cal-modes button').forEach(b => {
  b.addEventListener('click', () => {
    calMode = b.dataset.mode;
    $$('.cal-modes button').forEach(x => x.classList.toggle('active', x === b));
    openWeekDay = null;
    renderCalendar();
  });
});
$('#calPrev').addEventListener('click', () => shiftCalendar(-1));
$('#calNext').addEventListener('click', () => shiftCalendar(1));

function shiftCalendar(dir) {
  if (calMode === 'month') calCursor = new Date(calCursor.getFullYear(), calCursor.getMonth() + dir, 1);
  else if (calMode === 'week') calCursor = addDays(calCursor, dir * 7);
  else calCursor = addDays(calCursor, dir);
  renderCalendar();
}

function myLessons() {
  if (currentUser.role === 'trainer') return state.lessons.filter(l => l.trainerId === currentUser.staffId);
  if (currentUser.role === 'staff') {
    const ids = new Set(state.tasks.filter(t => t.staffId === currentUser.staffId).map(t => t.lessonId));
    return state.lessons.filter(l => ids.has(l.id));
  }
  return state.lessons;
}

function renderCalendar() {
  const area = $('#calendarArea');
  const title = $('#calTitle');
  const lessons = myLessons();

  if (calMode === 'month') {
    const y = calCursor.getFullYear(), m = calCursor.getMonth();
    title.textContent = calCursor.toLocaleDateString('ru-RU', { month: 'long', year: 'numeric' });
    const first = new Date(y, m, 1);
    const dow = (first.getDay() + 6) % 7;
    const start = addDays(first, -dow);
    let html = '<div class="month-grid">';
    ['Пн','Вт','Ср','Чт','Пт','Сб','Вс'].forEach(d => html += `<div class="dow">${d}</div>`);
    for (let i = 0; i < 42; i++) {
      const d = addDays(start, i);
      const ds = ymd(d);
      const isOther = d.getMonth() !== m;
      const isToday = sameDay(d, new Date());
      const dayLessons = lessons.filter(l => l.date === ds);
      html += `<div class="month-cell ${isOther ? 'other' : ''} ${isToday ? 'today' : ''}">
        <div class="num">${d.getDate()}</div>
        ${dayLessons.slice(0, 3).map(l => `<div class="ev" data-lesson="${l.id}">${l.time} ${horseName(l.horseId)}</div>`).join('')}
        ${dayLessons.length > 3 ? `<div class="ev" style="background:var(--panel-2);color:var(--muted);">+${dayLessons.length - 3}</div>` : ''}
      </div>`;
    }
    html += '</div>';
    area.innerHTML = html;
    area.querySelectorAll('.ev[data-lesson]').forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); openLessonModal(el.dataset.lesson); };
    });

  } else if (calMode === 'week') {
    const dow = (calCursor.getDay() + 6) % 7;
    const start = addDays(calCursor, -dow);
    const end = addDays(start, 6);
    title.textContent = start.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' }) + ' — ' +
      end.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });

    const today = new Date();
    const weekHasToday = [0,1,2,3,4,5,6].some(i => sameDay(addDays(start, i), today));
    if (openWeekDay === null) openWeekDay = weekHasToday ? ymd(today) : ymd(start);

    let html = '<div class="week-grid">';
    for (let i = 0; i < 7; i++) {
      const d = addDays(start, i);
      const ds = ymd(d);
      const isToday = sameDay(d, today);
      const isOpen = openWeekDay === ds;
      const dayLessons = lessons.filter(l => l.date === ds).sort((a, b) => a.time.localeCompare(b.time));
      html += `<div class="day-block ${isToday ? 'today-block' : ''}" data-day="${ds}">
        <div class="day-title">
          ${d.toLocaleDateString('ru-RU', { weekday: 'short', day: 'numeric', month: 'short' })}
          ${isToday ? '<span class="badge">сегодня</span>' : ''}
        </div>
        ${isOpen
          ? (dayLessons.length ? dayLessons.map(lessonRow).join('') : '<div class="empty" style="padding:6px 0;">—</div>')
          : `<div class="empty" style="padding:4px 0;font-size:11px;">${dayLessons.length} трен. · нажмите</div>`}
      </div>`;
    }
    html += '</div>';
    area.innerHTML = html;

    area.querySelectorAll('.day-block').forEach(el => {
      el.onclick = (e) => {
        if (e.target.closest('.lesson')) return;
        openWeekDay = el.dataset.day;
        renderCalendar();
      };
    });
    area.querySelectorAll('.lesson').forEach(el => {
      el.onclick = (e) => { e.stopPropagation(); openLessonModal(el.dataset.lesson); };
    });

  } else {
    title.textContent = calCursor.toLocaleDateString('ru-RU', { weekday: 'long', day: 'numeric', month: 'long' });
    const ds = ymd(calCursor);
    const dayLessons = lessons.filter(l => l.date === ds).sort((a, b) => a.time.localeCompare(b.time));
    area.innerHTML = `<div class="day-grid"><div class="day-block">
      ${dayLessons.length ? dayLessons.map(lessonRow).join('') : '<div class="empty">На этот день тренировок нет</div>'}
    </div></div>`;
    area.querySelectorAll('.lesson').forEach(el => {
      el.onclick = () => openLessonModal(el.dataset.lesson);
    });
  }
}

function lessonRow(l) {
  return `<div class="lesson" data-lesson="${l.id}">
    <div class="time">${l.time}</div>
    <div class="info">
      <div>${horseName(l.horseId)} · ${l.duration} мин${l.student ? ' · ' + l.student : ''}</div>
      <div class="horse">Тренер: ${staffName(l.trainerId)}</div>
    </div>
  </div>`;
}

/* ===== МОДАЛКА ТРЕНИРОВКИ ===== */
$('#addLessonBtn').addEventListener('click', () => openLessonModal(null));
$('#lessonCancel').addEventListener('click', closeLessonModal);
$('#lessonModal').addEventListener('click', (e) => { if (e.target.id === 'lessonModal') closeLessonModal(); });

function openLessonModal(lessonId) {
  editingLessonId = lessonId || null;
  const l = lessonId ? state.lessons.find(x => x.id === lessonId) : null;
  $('#lessonModalTitle').textContent = l ? 'Редактировать тренировку' : 'Новая тренировка';
  $('#lessonDate').value = l ? l.date : ymd(calCursor);
  $('#lessonTime').value = l ? l.time : '10:00';
  $('#lessonHorse').innerHTML = state.horses.map(h => `<option value="${h.id}" ${l && l.horseId === h.id ? 'selected' : ''}>${h.name}</option>`).join('');
  const trainers = state.staff.filter(s => s.role === 'trainer');
  const pool = trainers.length ? trainers : state.staff;
  $('#lessonTrainer').innerHTML = pool.map(s => `<option value="${s.id}" ${l && l.trainerId === s.id ? 'selected' : ''}>${s.name}</option>`).join('');
  $('#lessonStudent').value = l ? (l.student || '') : '';
  $('#lessonDuration').value = l ? l.duration : 60;
  $('#lessonDelete').style.display = l ? 'block' : 'none';
  $('#lessonModal').classList.add('show');
  lockScroll();
}

function closeLessonModal() {
  $('#lessonModal').classList.remove('show');
  editingLessonId = null;
  unlockScroll();
}

$('#lessonSave').addEventListener('click', () => {
  const date = $('#lessonDate').value;
  const time = $('#lessonTime').value;
  const horseId = $('#lessonHorse').value;
  const trainerId = $('#lessonTrainer').value;
  const student = $('#lessonStudent').value.trim();
  const duration = Number($('#lessonDuration').value) || 60;
  if (!date || !time || !horseId || !trainerId) return toast('Заполните обязательные поля');

  if (editingLessonId) {
    const l = state.lessons.find(x => x.id === editingLessonId);
    if (!l) return;
    Object.assign(l, { date, time, horseId, trainerId, student, duration });
  } else {
    const newId = uid('l');
    state.lessons.push({ id: newId, date, time, horseId, trainerId, student, duration });
    ['pre', 'post'].forEach(phase => {
      state.manipulations[phase].forEach(m => {
        state.tasks.push({
          id: uid('t'), lessonId: newId, phase, manipId: m.id,
          staffId: null, done: false, time: ''
        });
      });
    });
  }
  saveState();
  closeLessonModal();
  toast(editingLessonId ? 'Тренировка обновлена' : 'Тренировка добавлена', true);
  renderCalendar();
});

$('#lessonDelete').addEventListener('click', () => {
  if (!editingLessonId) return;
  if (!confirm('Удалить тренировку и все её задачи?')) return;
  state.lessons = state.lessons.filter(l => l.id !== editingLessonId);
  state.tasks = state.tasks.filter(t => t.lessonId !== editingLessonId);
  saveState();
  closeLessonModal();
  renderCalendar();
  toast('Тренировка удалена', true);
});

/* ===== ЗАДАЧИ ===== */
let tasksPhase = 'pre';
$$('#tasksPhaseTabs button').forEach(b => {
  b.addEventListener('click', () => {
    tasksPhase = b.dataset.phase;
    $$('#tasksPhaseTabs button').forEach(x => x.classList.toggle('active', x === b));
    renderTasks();
  });
});

function renderTasks() {
  $('#tasksDateLabel').textContent = new Date().toLocaleDateString('ru-RU', { day: 'numeric', month: 'long' });
  const today = todayStr();
  const todayLessons = state.lessons.filter(l => l.date === today);
  const list = $('#tasksList');
  const isStaff = currentUser.role === 'staff';
  const canAssign = currentUser.role === 'owner' || currentUser.role === 'trainer';

  const rows = [];
  todayLessons.forEach(l => {
    state.tasks.filter(t => t.lessonId === l.id && t.phase === tasksPhase).forEach(t => {
      if (isStaff && t.staffId !== currentUser.staffId) return;
      rows.push({ l, t });
    });
  });

  if (!rows.length) {
    list.innerHTML = `<div class="empty">${isStaff ? 'На сегодня вам ничего не назначено' : 'На сегодня задач нет'}</div>`;
    return;
  }

  list.innerHTML = rows.map(({ l, t }) => {
    const m = state.manipulations[t.phase].find(x => x.id === t.manipId) || { name: '—' };
    const mine = t.staffId === currentUser.staffId;
    const staffOpts = state.staff
      .filter(s => s.role !== 'owner')
      .map(s => `<option value="${s.id}" ${t.staffId === s.id ? 'selected' : ''}>${s.name}</option>`)
      .join('');
    return `<div class="manip ${t.done ? 'done' : ''}">
      <input type="checkbox" data-task="${t.id}" ${t.done ? 'checked' : ''} ${isStaff && !mine ? 'disabled' : ''} />
      <span class="label">
        ${m.name}
        <div class="who">${horseName(l.horseId)} · ${l.time} · ${staffName(t.staffId)}</div>
      </span>
      ${canAssign ? `<select class="assign-sel" data-task="${t.id}"><option value="">— кто —</option>${staffOpts}</select>` : ''}
      ${mine ? '<span class="badge mine">моё</span>' : ''}
      ${t.done && t.time ? `<span class="badge">${t.time}</span>` : ''}
      ${t.done ? '<span class="badge done">готово</span>' : ''}
    </div>`;
  }).join('');

  list.querySelectorAll('input[type=checkbox]').forEach(cb => {
    cb.addEventListener('change', (e) => {
      const task = state.tasks.find(x => x.id === e.target.dataset.task);
      if (!task) return;
      task.done = e.target.checked;
      if (task.done && !task.time) {
        const now = new Date();
        task.time = pad(now.getHours()) + ':' + pad(now.getMinutes());
      }
      saveState();
      renderTasks();
    });
  });

  list.querySelectorAll('.assign-sel').forEach(sel => {
    sel.addEventListener('change', (e) => {
      const t = state.tasks.find(x => x.id === e.target.dataset.task);
      if (!t) return;
      t.staffId = e.target.value || null;
      saveState();
      renderTasks();
    });
  });
}

/* ===== ЛОШАДИ ===== */
function renderHorsesView() {
  const today = todayStr();
  const todayLessons = state.lessons.filter(l => l.date === today);
  const box = $('#horsesList');
  if (!todayLessons.length) {
    box.innerHTML = '<div class="empty">Сегодня тренировок нет</div>';
    return;
  }
  let html = '';
  state.horses.forEach(h => {
    const hl = todayLessons.filter(l => l.horseId === h.id);
    if (!hl.length) return;
    html += `<div class="card" style="margin-bottom:10px;">
      <h2>${h.name} <span class="sub">${hl.length} трен.</span></h2>
      ${hl.map(l => {
        const pre = state.tasks.filter(t => t.lessonId === l.id && t.phase === 'pre');
        const post = state.tasks.filter(t => t.lessonId === l.id && t.phase === 'post');
        const donePre = pre.filter(t => t.done).length;
        const donePost = post.filter(t => t.done).length;
        const total = pre.length + post.length;
        const done = donePre + donePost;
        const pct = total ? Math.round(done / total * 100) : 0;
        return `<div class="lesson" data-lesson="${l.id}">
          <div class="time">${l.time}</div>
          <div class="info">
            <div>${l.duration} мин${l.student ? ' · ' + l.student : ''}</div>
            <div class="horse">Тренер: ${staffName(l.trainerId)}</div>
            <div class="horse">До: ${donePre}/${pre.length} · После: ${donePost}/${post.length}</div>
          </div>
          <div class="readiness">
            <div class="readiness-pct">${pct}%</div>
            <div class="readiness-bar"><span style="width:${pct}%"></span></div>
          </div>
        </div>`;
      }).join('')}
    </div>`;
  });
  box.innerHTML = html || '<div class="empty">Нет данных</div>';
}

/* ===== АДМИН ===== */
let manipPhase = 'pre';
$$('#manipPhaseTabs button').forEach(b => {
  b.addEventListener('click', () => {
    manipPhase = b.dataset.phase;
    $$('#manipPhaseTabs button').forEach(x => x.classList.toggle('active', x === b));
    renderAdmin();
  });
});

function renderAdmin() {
  $('#staffAdminList').innerHTML = state.staff.map(s => `
    <div class="list-item">
      <span class="name">${s.name}</span>
      <button class="badge" data-role-staff="${s.id}">${ROLES[s.role] ? ROLES[s.role].title : s.role}</button>
      <button class="btn small ghost" data-del-staff="${s.id}">✕</button>
    </div>
  `).join('') || '<div class="empty">Нет сотрудников</div>';

  $('#horseAdminList').innerHTML = state.horses.map(h => `
    <div class="list-item">
      <span class="name">${h.name}</span>
      <button class="btn small ghost" data-del-horse="${h.id}">✕</button>
    </div>
  `).join('') || '<div class="empty">Нет лошадей</div>';

  $('#manipAdminList').innerHTML = state.manipulations[manipPhase].map(m => `
    <div class="list-item">
      <span class="name">${m.name}</span>
      <button class="btn small ghost" data-del-manip="${m.id}">✕</button>
    </div>
  `).join('') || '<div class="empty">Пусто</div>';

  $$('[data-role-staff]').forEach(b => b.onclick = () => {
    const s = state.staff.find(x => x.id === b.dataset.roleStaff);
    if (!s) return;
    const order = ['staff', 'trainer', 'owner'];
    s.role = order[(order.indexOf(s.role) + 1) % order.length];
    saveState(); renderAdmin();
  });
  $$('[data-del-staff]').forEach(b => b.onclick = () => {
    state.staff = state.staff.filter(x => x.id !== b.dataset.delStaff);
    saveState(); renderAdmin();
  });
  $$('[data-del-horse]').forEach(b => b.onclick = () => {
    state.horses = state.horses.filter(x => x.id !== b.dataset.delHorse);
    saveState(); renderAdmin();
  });
  $$('[data-del-manip]').forEach(b => b.onclick = () => {
    state.manipulations[manipPhase] = state.manipulations[manipPhase].filter(x => x.id !== b.dataset.delManip);
    saveState(); renderAdmin();
  });
}

$('#addStaffBtn').addEventListener('click', () => {
  const name = $('#newStaff').value.trim();
  const role = $('#newStaffRole').value;
  if (!name) return;
  state.staff.push({ id: uid('s'), name, role });
  saveState(); $('#newStaff').value = ''; renderAdmin();
});
$('#addHorseBtn').addEventListener('click', () => {
  const name = $('#newHorse').value.trim();
  if (!name) return;
  state.horses.push({ id: uid('h'), name });
  saveState(); $('#newHorse').value = ''; renderAdmin();
});
$('#addManipBtn').addEventListener('click', () => {
  const name = $('#newManip').value.trim();
  if (!name) return;
  state.manipulations[manipPhase].push({ id: uid('m'), name });
  saveState(); $('#newManip').value = ''; renderAdmin();
});

/* ===== СВАЙПЫ ===== */
function bindSwipe(el, onLeft, onRight, onUp, onDown) {
  let x0 = null, y0 = null, t0 = 0;
  el.addEventListener('touchstart', e => {
    if (e.touches.length !== 1) return;
    x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; t0 = Date.now();
  }, { passive: true });
  el.addEventListener('touchend', e => {
    if (x0 === null) return;
    const dx = e.changedTouches[0].clientX - x0;
    const dy = e.changedTouches[0].clientY - y0;
    const dt = Date.now() - t0;
    x0 = null;
    if (dt > 600) return;
    if (Math.abs(dx) > Math.abs(dy) && Math.abs(dx) > 60) {
      if (dx < 0) onLeft && onLeft(); else onRight && onRight();
    } else if (Math.abs(dy) > 60) {
      if (dy < 0) onUp && onUp(); else onDown && onDown();
    }
  }, { passive: true });
}

// Свайпы в расписании
bindSwipe($('#calendarArea'), () => {
  const order = ['month', 'week', 'day'];
  calMode = order[(order.indexOf(calMode) + 1) % order.length];
  $$('.cal-modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === calMode));
  openWeekDay = null; renderCalendar();
}, () => {
  const order = ['month', 'week', 'day'];
  calMode = order[(order.indexOf(calMode) - 1 + order.length) % order.length];
  $$('.cal-modes button').forEach(b => b.classList.toggle('active', b.dataset.mode === calMode));
  openWeekDay = null; renderCalendar();
});

// Свайпы в задачах
bindSwipe($('#viewTasks'), () => {
  tasksPhase = tasksPhase === 'pre' ? 'post' : 'pre';
  $$('#tasksPhaseTabs button').forEach(b => b.classList.toggle('active', b.dataset.phase === tasksPhase));
  renderTasks();
}, () => {
  tasksPhase = tasksPhase === 'pre' ? 'post' : 'pre';
  $$('#tasksPhaseTabs button').forEach(b => b.classList.toggle('active', b.dataset.phase === tasksPhase));
  renderTasks();
});

renderLogin();
